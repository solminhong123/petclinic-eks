apiVersion: apps/v1
kind: Deployment
metadata:
  name: was
  namespace: petclinic
  labels:
    app: was
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: was
  template:
    metadata:
      labels:
        app: was
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app: was
      initContainers:
      - name: wait-db
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z db 3306; do echo waiting for db; sleep 2; done"]
      containers:
      - name: was
        image: ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic-was:1.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: was-config
        - secretRef:
            name: was-secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
